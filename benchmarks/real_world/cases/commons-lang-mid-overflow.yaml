issue_title: Substring extraction fails for an extremely large requested length
issue_description: >-
  Requesting the remainder of a string with a valid start position and a very large length
  can return the wrong substring when the position and length overflow. The String and
  mutable string-builder APIs must retain their established behavior for ordinary lengths.
