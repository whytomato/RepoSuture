schema_version: 2
workflow: agent_repair
id: commons-codec-zero-big-integer
repository: ../.cache/fixtures/commons-codec-zero-big-integer
base_commit: fd6e8c53f73976e1ba89edb982b20de2d2bc90c1
issue_title: Zero BigInteger conversion loses its byte representation
issue_description: >-
  Converting a zero BigInteger to the byte form used by Base64 returns an empty
  representation. Zero must retain a single zero byte, while signed, byte-boundary,
  and large integer behavior must remain compatible.
target_test:
  class_name: org.apache.commons.codec.binary.Base64ToIntegerBytesTest
  method_name: testBigIntegerWithAllZeros
regression_tests:
  - class_name: org.apache.commons.codec.binary.Base64ToIntegerBytesTest
    method_name: testBigIntegerWithBoundaryValues
  - class_name: org.apache.commons.codec.binary.Base64ToIntegerBytesTest
    method_name: testBigIntegerWithMixedSigns
  - class_name: org.apache.commons.codec.binary.Base64ToIntegerBytesTest
    method_name: testBigIntegerWithVeryLargeNumber
target_test_timeout_seconds: 1200
regression_timeout_seconds: 2400
expected_baseline_failure: test_failure
agent_budgets:
  max_model_turns: 18
  max_tool_calls: 45
  max_patch_attempts: 4
  max_target_test_executions: 10
  max_regression_executions: 4
  max_wall_clock_seconds: 3600
  api_timeout_seconds: 60
  api_max_retries: 2
  max_output_tokens: 4096
  max_retained_model_output_bytes: 65536
  max_retained_tool_output_bytes: 65536
allowed_file_policy:
  production_java_only: true
