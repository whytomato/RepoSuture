issue_title: Integer map lookup truncates values when a default function is supplied
issue_description: >-
  An integer lookup using the overload that accepts a default function truncates values
  outside the byte range. Existing values and values returned by the default function must
  preserve full integer precision without changing the other numeric lookup APIs.
