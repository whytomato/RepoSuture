name: Real-world benchmark validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/real-world-validation.yml"
      - "benchmarks/real_world/**"
      - "src/reposuture/real_world.py"
      - "tests/test_real_world.py"

permissions:
  contents: read

concurrency:
  group: real-world-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install RepoSuture
        run: python -m pip install -e ".[dev]"

      - name: Prepare diagnostic directory
        shell: bash
        run: mkdir -p ci-artifacts/real-world-validation/results

      - name: Bootstrap locked upstream fixtures
        shell: bash
        run: |
          set -o pipefail
          python benchmarks/real_world/bootstrap_real_world.py 2>&1 |
            tee ci-artifacts/real-world-validation/bootstrap.log

      - name: Validate all eight V2 Cases with real Maven and JUnit
        shell: bash
        run: |
          set -o pipefail
          reposuture validate-benchmark \
            benchmarks/real_world/suites/maven-real-world-v2.yaml \
            --artifacts-dir ci-artifacts/real-world-validation/results 2>&1 |
            tee ci-artifacts/real-world-validation/validation.log

      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-world-validation
          path: ci-artifacts/real-world-validation
          if-no-files-found: warn
