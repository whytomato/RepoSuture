[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
description = "A test-grounded software engineering agent for autonomous Java/Maven bug repair"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.46.0,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
patchpilot = "patchpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real Git, Java, and Maven processes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
